<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>OP Crypto Signal Dashboard</title>

<style>
body {
  background: #0b0f14;
  font-family: monospace;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 10px;
}

.card {
  border: 1px solid #222;
  padding: 10px;
  height: 300px;
}

.title {
  font-weight: bold;
}

.signal {
  margin: 5px 0;
}

.bar-container {
  height: 10px;
  background: #222;
  margin-bottom: 8px;
  position: relative;
}

.bar-buy {
  height: 100%;
  background: #00ff9c;
  width: 50%;
}

.bar-sell {
  height: 100%;
  background: #ff4d4d;
  position: absolute;
  right: 0;
  width: 50%;
}

.trade {
  font-size: 11px;
  display: flex;
  justify-content: space-between;
}

.buy { color: #00ff9c; }
.sell { color: #ff4d4d; }

</style>
</head>

<body>

<div class="container" id="container"></div>

<script>
const coins = ["btcusdt","ethusdt","solusdt","bnbusdt","xrpusdt","dogeusdt"];

const container = document.getElementById("container");

coins.forEach(symbol => {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="title">${symbol.toUpperCase()}</div>
    <div class="signal">Loading...</div>

    <div class="bar-container">
      <div class="bar-buy"></div>
      <div class="bar-sell"></div>
    </div>

    <div class="trades"></div>
  `;

  container.appendChild(card);

  const signalDiv = card.querySelector(".signal");
  const tradesDiv = card.querySelector(".trades");
  const buyBar = card.querySelector(".bar-buy");
  const sellBar = card.querySelector(".bar-sell");

  let buyVol = 0;
  let sellVol = 0;

  setInterval(() => {
    buyVol = 0;
    sellVol = 0;
  }, 30000);

  const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    const side = data.m ? "SELL" : "BUY";
    const price = parseFloat(data.p).toFixed(2);
    const qty = parseFloat(data.q);

    if (side === "BUY") buyVol += qty;
    else sellVol += qty;

    const total = buyVol + sellVol;
    const buyPercent = total ? (buyVol / total) * 100 : 50;
    const sellPercent = 100 - buyPercent;

    buyBar.style.width = buyPercent + "%";
    sellBar.style.width = sellPercent + "%";

    // SIGNAL
    let signal = "NEUTRAL";

    if (buyPercent > 65) signal = "STRONG UP 🚀";
    else if (buyPercent > 55) signal = "UP";
    else if (sellPercent > 65) signal = "STRONG DOWN 🔻";
    else if (sellPercent > 55) signal = "DOWN";

    signalDiv.innerHTML = `${signal} (${buyPercent.toFixed(0)}% BUY)`;

    const trade = document.createElement("div");
    trade.className = "trade " + (side === "BUY" ? "buy" : "sell");

    trade.innerHTML = `
      <span>${side}</span>
      <span>${qty.toFixed(2)}</span>
      <span>${price}</span>
    `;

    tradesDiv.prepend(trade);

    if (tradesDiv.children.length > 15) {
      tradesDiv.removeChild(tradesDiv.lastChild);
    }
  };
});
</script>

</body>
</html>
