<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Candlestick Dashboard</title>

<style>
body {
  background: #0b0f14;
  margin: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 5px;
  height: 100vh;
}

.chart {
  height: 100%;
}
</style>
</head>

<body>

<div class="grid">

  <div class="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=5&theme=dark" width="100%" height="100%"></iframe>
  </div>

  <div class="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:ETHUSDT&interval=5&theme=dark" width="100%" height="100%"></iframe>
  </div>

  <div class="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:SOLUSDT&interval=5&theme=dark" width="100%" height="100%"></iframe>
  </div>

  <div class="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BNBUSDT&interval=5&theme=dark" width="100%" height="100%"></iframe>
  </div>

  <div class="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:XRPUSDT&interval=5&theme=dark" width="100%" height="100%"></iframe>
  </div>

  <div class="chart">
    <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:DOGEUSDT&interval=5&theme=dark" width="100%" height="100%"></iframe>
  </div>

</div>

</body>
</html>
