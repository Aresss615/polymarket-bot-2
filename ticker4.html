<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Ticker Test</title>

<style>
  :root {
    --bg: #0b0f14;
    --panel: #101722;
    --line: #1f2c3f;
    --text: #eaf0ff;
    --muted: #95a6c2;
    --up: #1bd48d;
    --down: #ff6070;
    --accent: #4d8dff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(circle at 20% 10%, rgba(77, 141, 255, 0.16), transparent 40%), var(--bg);
    color: var(--text);
    font-family: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
    height: 100vh;
    overflow: hidden;
  }

  .shell {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 10px;
    padding: 10px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    padding: 10px;
  }

  .title {
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 0.9rem;
  }

  .meta {
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--muted);
    font-size: 0.74rem;
  }

  .pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 9px;
    background: #0c141f;
  }

  .pill.live {
    color: var(--up);
    border-color: rgba(27, 212, 141, 0.45);
    background: rgba(27, 212, 141, 0.1);
  }

  .symbols {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .sym-btn {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #0d1520;
    color: var(--muted);
    padding: 5px 8px;
    font-size: 0.72rem;
    cursor: pointer;
    text-transform: uppercase;
  }

  .sym-btn.active {
    color: var(--text);
    border-color: rgba(77, 141, 255, 0.55);
    background: rgba(77, 141, 255, 0.18);
  }

  .layout {
    display: grid;
    grid-template-columns: 1.8fr 1fr;
    gap: 10px;
    min-height: 0;
  }

  .panel {
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel-head {
    border-bottom: 1px solid var(--line);
    padding: 8px 10px;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .panel-body {
    min-height: 0;
    flex: 1;
    padding: 10px;
  }

  #chartWrap {
    height: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #0b121c;
    position: relative;
    overflow: hidden;
  }

  #chartSvg {
    width: 100%;
    height: 100%;
    display: block;
  }

  #priceTag {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    background: rgba(11, 15, 20, 0.75);
    border: 1px solid rgba(31, 44, 63, 0.9);
  }

  #log {
    height: 100%;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #0b121c;
  }

  .entry {
    border-bottom: 1px dashed rgba(149, 166, 194, 0.2);
    padding: 6px 8px;
    font-size: 0.72rem;
    line-height: 1.35;
  }

  .entry:last-child { border-bottom: 0; }
  .entry.up { color: var(--up); }
  .entry.down { color: var(--down); }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
    .panel { min-height: 300px; }
  }
</style>
</head>

<body>
<div class="shell">
  <header class="topbar">
    <div>
      <div class="title">Ticker4 Realtime Stream Test</div>
      <div class="meta">
        <span id="status" class="pill">connecting</span>
        <span id="streamInfo" class="pill">--</span>
      </div>
    </div>
    <div id="symbols" class="symbols"></div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-head">
        <span>Live Tick Chart</span>
        <span id="chartMeta">--</span>
      </div>
      <div class="panel-body">
        <div id="chartWrap">
          <div id="priceTag">--</div>
          <svg id="chartSvg" viewBox="0 0 1000 420" preserveAspectRatio="none"></svg>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span>1m Direction Log</span>
        <span>Last 120 entries</span>
      </div>
      <div class="panel-body">
        <div id="log"></div>
      </div>
    </section>
  </main>
</div>

<script>
  const SYMBOLS = ["btcusdt", "ethusdt", "solusdt", "dogeusdt", "xrpusdt", "bnbusdt", "adausdt"];
  const MAX_POINTS = 320;
  const MAX_LOG = 120;

  const nodes = {
    symbols: document.getElementById("symbols"),
    status: document.getElementById("status"),
    streamInfo: document.getElementById("streamInfo"),
    chartMeta: document.getElementById("chartMeta"),
    priceTag: document.getElementById("priceTag"),
    chartSvg: document.getElementById("chartSvg"),
    log: document.getElementById("log")
  };

  const points = [];
  let ws = null;
  let activeSymbol = "btcusdt";
  let currentPrice = null;
  let minuteOpen = null;
  let currentMinute = null;

  function labelFor(symbol) {
    return symbol.replace("usdt", "").toUpperCase() + "/USDT";
  }

  function fmtPrice(v) {
    if (typeof v !== "number" || Number.isNaN(v)) return "--";
    return v.toLocaleString(undefined, { minimumFractionDigits: 4, maximumFractionDigits: 4 });
  }

  function buildSymbolButtons() {
    nodes.symbols.innerHTML = "";
    SYMBOLS.forEach((symbol) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sym-btn" + (symbol === activeSymbol ? " active" : "");
      btn.textContent = labelFor(symbol);
      btn.addEventListener("click", () => switchSymbol(symbol));
      nodes.symbols.appendChild(btn);
    });
  }

  function drawChart() {
    const w = 1000;
    const h = 420;

    nodes.chartSvg.innerHTML = "";
    if (points.length < 2) return;

    let min = Infinity;
    let max = -Infinity;
    points.forEach((p) => {
      if (p < min) min = p;
      if (p > max) max = p;
    });

    const spread = Math.max(max - min, max * 0.0005, 1e-9);
    const top = max + spread * 0.15;
    const bottom = min - spread * 0.15;
    const range = top - bottom;

    const coords = points.map((price, i) => {
      const x = (i / (points.length - 1)) * w;
      const y = h - ((price - bottom) / range) * h;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });

    const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    line.setAttribute("points", coords.join(" "));
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", "#4d8dff");
    line.setAttribute("stroke-width", "2");
    line.setAttribute("stroke-linecap", "round");
    nodes.chartSvg.appendChild(line);

    const last = points[points.length - 1];
    const lastY = h - ((last - bottom) / range) * h;
    const marker = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    marker.setAttribute("cx", w.toString());
    marker.setAttribute("cy", lastY.toFixed(1));
    marker.setAttribute("r", "4");
    marker.setAttribute("fill", "#1bd48d");
    nodes.chartSvg.appendChild(marker);
  }

  function addLog(open, close, t) {
    const dir = close >= open ? "UP" : "DOWN";
    const row = document.createElement("div");
    row.className = `entry ${dir === "UP" ? "up" : "down"}`;
    row.textContent = `${t.toLocaleTimeString()} ${labelFor(activeSymbol)} ${dir} | ${fmtPrice(open)} -> ${fmtPrice(close)}`;
    nodes.log.prepend(row);
    while (nodes.log.children.length > MAX_LOG) {
      nodes.log.removeChild(nodes.log.lastChild);
    }
  }

  function handleTrade(price, ts) {
    currentPrice = price;
    points.push(price);
    if (points.length > MAX_POINTS) points.shift();

    nodes.priceTag.textContent = `${labelFor(activeSymbol)} ${fmtPrice(price)}`;
    nodes.chartMeta.textContent = `${points.length} ticks buffered`;
    nodes.streamInfo.textContent = `ws ${activeSymbol}@trade`;
    drawChart();

    const d = new Date(ts);
    const minuteKey = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}-${d.getUTCHours()}-${d.getUTCMinutes()}`;
    if (currentMinute === null) {
      currentMinute = minuteKey;
      minuteOpen = price;
      return;
    }
    if (minuteKey !== currentMinute) {
      if (minuteOpen !== null) addLog(minuteOpen, price, d);
      currentMinute = minuteKey;
      minuteOpen = price;
    }
  }

  function connect(symbol) {
    if (ws) ws.close();
    ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

    ws.onopen = () => {
      nodes.status.textContent = "live";
      nodes.status.className = "pill live";
    };

    ws.onmessage = (event) => {
      const d = JSON.parse(event.data);
      handleTrade(Number(d.p), Number(d.T) || Date.now());
    };

    ws.onclose = () => {
      nodes.status.textContent = "reconnecting";
      nodes.status.className = "pill";
      setTimeout(() => {
        if (symbol === activeSymbol) connect(symbol);
      }, 1000);
    };

    ws.onerror = () => {
      nodes.status.textContent = "stream error";
      nodes.status.className = "pill";
    };
  }

  function switchSymbol(symbol) {
    if (symbol === activeSymbol) return;
    activeSymbol = symbol;
    points.length = 0;
    currentPrice = null;
    minuteOpen = null;
    currentMinute = null;
    nodes.log.innerHTML = "";
    nodes.chartSvg.innerHTML = "";
    nodes.priceTag.textContent = `${labelFor(symbol)} --`;
    buildSymbolButtons();
    connect(symbol);
  }

  buildSymbolButtons();
  nodes.priceTag.textContent = `${labelFor(activeSymbol)} --`;
  connect(activeSymbol);
</script>

</body>
</html>
