<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polymarket Bot Monitor</title>
  <link rel="stylesheet" href="ticker3.css">
</head>
<body>
  <div class="shell">
    <div class="column left-column">
      <section class="panel header-panel">
        <div class="hero compact-hero">
          <div class="title compact-title">Polymarket Bot Monitor</div>
          <div class="live-clock" id="liveClock">00:00:00</div>
        </div>

        <div class="status-strip">
          <div id="feedStatus" class="chip warn">Idle</div>
          <div class="chip">Mode<strong id="modeValue">--</strong></div>
          <div class="chip">Tick<strong id="tickValue">0</strong></div>
          <div class="chip">15m<strong id="mode15mValue">waiting</strong></div>
          <div class="chip">Updated<strong id="updatedValue">--</strong></div>
        </div>
      </section>

      <section class="panel stage-panel">
        <div class="section-head">
          <div>
            <div class="section-title">Market Theater</div>
          </div>
          <div class="timeframe-toggle">
            <button class="timeframe-btn active" id="timeframeBtn5m" data-timeframe="5" type="button">5 Minute</button>
            <button class="timeframe-btn" id="timeframeBtn15m" data-timeframe="15" type="button">15 Minute</button>
          </div>
        </div>

        <div class="stage-body">
          <div class="symbol-strip">
            <button class="symbol-btn active" data-symbol="btc" type="button">BTC</button>
            <button class="symbol-btn" data-symbol="eth" type="button">ETH</button>
            <button class="symbol-btn" data-symbol="sol" type="button">SOL</button>
            <button class="symbol-btn" data-symbol="doge" type="button">DOGE</button>
            <button class="symbol-btn" data-symbol="xrp" type="button">XRP</button>
            <button class="symbol-btn" data-symbol="bnb" type="button">BNB</button>
            <button class="symbol-btn" data-symbol="hype" type="button">HYPE</button>
          </div>

          <div class="chart-stage">
            <div class="stage-overlay">
              <div class="stage-label">Reference Tape</div>
              <div id="stageChartLabel" class="stage-chart-title">BTCUSDT 5m</div>
              <div id="stageChartVenue" class="stage-chart-sub">Binance reference context</div>
            </div>
            <iframe
              id="stageChart"
              src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&hide_side_toolbar=1&save_image=0&withdateranges=0"
              loading="lazy"
              title="Reference chart"
            ></iframe>
          </div>

          <div class="recent-panel">
            <div class="subsection-head">
              <div>
                <div class="section-title">Recent Trades</div>
              </div>
            </div>
            <div id="recentTrades" class="trade-grid"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="column right-column">
      <section class="panel status-panel">
        <div class="section-head">
          <div>
            <div class="section-title">System View</div>
          </div>
        </div>

        <div class="status-content compact-status-content">
          <div class="stats compact-stats money-stats">
            <div class="stat compact-stat">
              <div class="stat-label">Balance</div>
              <div id="balanceValue" class="stat-value">$0.00</div>
            </div>
            <div class="stat compact-stat">
              <div class="stat-label">Available</div>
              <div id="availableValue" class="stat-value">$0.00</div>
            </div>
            <div class="stat compact-stat">
              <div class="stat-label">Equity</div>
              <div id="equityValue" class="stat-value">$0.00</div>
            </div>
            <div class="stat compact-stat">
              <div class="stat-label">Win Rate</div>
              <div id="winRateValue" class="stat-value">0%</div>
            </div>
            <div class="stat compact-stat">
              <div class="stat-label">Open Risk</div>
              <div id="riskValue" class="stat-value">$0.00</div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel activity-panel">
        <div class="section-head">
          <div>
            <div class="section-title">Activity Log</div>
          </div>
        </div>

        <div class="activity-panel-body">
          <div id="activityLog" class="activity compact-activity"></div>
        </div>
      </section>

      <section class="panel ops-panel">
        <div class="section-head">
          <div>
            <div class="section-title">Signal Board</div>
          </div>
          <div class="filters">
            <button class="filter-btn active" data-filter="actionable" data-value="true" type="button">Actionable</button>
            <button class="filter-btn" data-filter="actionable" data-value="false" type="button">All</button>
            <button class="filter-btn active" data-filter="marketType" data-value="all" type="button">Any Interval</button>
            <button class="filter-btn" data-filter="marketType" data-value="5m" type="button">5m</button>
            <button class="filter-btn" data-filter="marketType" data-value="15m" type="button">15m</button>
            <button class="filter-btn active" data-filter="direction" data-value="all" type="button">Any Side</button>
            <button class="filter-btn" data-filter="direction" data-value="BUY" type="button">Buy</button>
            <button class="filter-btn" data-filter="direction" data-value="SELL" type="button">Sell</button>
          </div>
        </div>

        <div class="ops-body">
          <div id="signalList" class="signal-list"></div>
        </div>
      </section>
    </div>
  </div>

  <script src="ticker3.js"></script>
</body>
</html>
