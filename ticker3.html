<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polymarket Ticker And Charts</title>
  <style>
    :root {
      --panel: #0f1622;
      --panel-2: #131c2b;
      --line: #233044;
      --text: #e9f0ff;
      --muted: #93a5c1;
      --up: #1dd18b;
      --down: #ff5e6c;
      --warn: #ffbf57;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: Consolas, "SFMono-Regular", Menlo, Monaco, monospace;
      background:
        radial-gradient(circle at 18% 12%, rgba(63, 134, 255, 0.18), transparent 40%),
        radial-gradient(circle at 82% 88%, rgba(29, 209, 139, 0.12), transparent 44%),
        linear-gradient(160deg, #070a0f 0%, #0a1018 48%, #080d14 100%);
      height: 100vh;
      overflow: hidden;
    }

    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 10px;
    }

    .topbar {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .title {
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    .sub {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: var(--warn);
      background: rgba(255, 191, 87, 0.09);
    }

    .badge.live {
      color: var(--up);
      border-color: rgba(29, 209, 139, 0.4);
      background: rgba(29, 209, 139, 0.1);
    }

    .view-controls {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #0d141f;
    }

    .view-btn {
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 10px;
      cursor: pointer;
    }

    .view-btn + .view-btn {
      border-left: 1px solid var(--line);
    }

    .view-btn.active {
      color: var(--text);
      background: rgba(63, 134, 255, 0.18);
    }

    .grid {
      min-height: 0;
      display: grid;
      grid-template-columns: 1.3fr 1.7fr;
      gap: 10px;
    }

    .grid.show-ticker {
      grid-template-columns: 1fr;
    }

    .grid.show-chart {
      grid-template-columns: 1fr;
    }

    .grid.show-ticker .chart-panel,
    .grid.show-chart .ticker-panel {
      display: none;
    }

    .panel {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }

    .panel-head {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .panel-body {
      min-height: 0;
      flex: 1;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cards {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding-right: 2px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .price {
      font-size: 0.92rem;
      color: var(--text);
    }

    .sig {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .bar {
      height: 10px;
      border-radius: 8px;
      background: #202a3d;
      position: relative;
      overflow: hidden;
    }

    .bar-buy,
    .bar-sell {
      position: absolute;
      top: 0;
      height: 100%;
      transition: width 120ms linear;
    }

    .bar-buy {
      left: 0;
      background: linear-gradient(90deg, #0e8f5f, #1dd18b);
      width: 50%;
    }

    .bar-sell {
      right: 0;
      background: linear-gradient(90deg, #ff7882, #ff5e6c);
      width: 50%;
    }

    .mini-trades {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0d141f;
    }

    .trade-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 6px;
      font-size: 0.68rem;
      padding: 4px 6px;
      border-bottom: 1px dashed rgba(147, 165, 193, 0.18);
      align-items: center;
    }

    .trade-row:last-child { border-bottom: 0; }
    .buy { color: var(--up); }
    .sell { color: var(--down); }

    .charts {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 8px;
      overflow: hidden;
      padding-right: 2px;
      align-content: stretch;
    }

    .charts > div {
      min-height: 0;
    }

    .chart-tile {
      min-height: 0;
      position: relative;
    }

    .chart-label {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text);
      background: rgba(7, 10, 15, 0.9);
      border: 1px solid rgba(77, 141, 255, 0.6);
      border-radius: 999px;
      padding: 6px 12px;
      pointer-events: none;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0a0f17;
    }

    @media (max-width: 1300px) {
      .grid { grid-template-columns: 1fr; }
      .panel { min-height: 420px; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .charts {
        grid-template-rows: none;
        grid-auto-rows: minmax(220px, 1fr);
        overflow: auto;
      }
    }

    @media (max-width: 760px) {
      .cards, .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="title">Polymarket Live Ticker Dashboard</div>
        <div class="sub">Dark mode with ticker plus 7 market charts</div>
      </div>
      <span id="feedStatus" class="badge">connecting...</span>
      <div class="view-controls" aria-label="Layout view controls">
        <button id="viewBoth" class="view-btn active" type="button" data-view="both">Both</button>
        <button id="viewTicker" class="view-btn" type="button" data-view="ticker">Ticker</button>
        <button id="viewChart" class="view-btn" type="button" data-view="chart">Chart</button>
      </div>
    </header>

    <main id="mainGrid" class="grid">
      <section class="panel ticker-panel">
        <div class="panel-head">
          <span>Live Multi-Symbol Ticker</span>
          <span id="leftMeta">0 symbols</span>
        </div>
        <div class="panel-body">
          <div id="tickerCards" class="cards"></div>
        </div>
      </section>

      <section class="panel chart-panel">
        <div class="panel-head">
          <span>7 Market Charts (5m)</span>
          <span>Binance + Hyperliquid view</span>
        </div>
        <div class="panel-body">
          <div id="chartGrid" class="charts"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SYMBOLS = ["btcusdt", "ethusdt", "dogeusdt", "solusdt", "xrpusdt", "bnbusdt", "adausdt"];
    const CHART_ITEMS = [
      { title: "BTCUSDT", src: "https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&save_image=0&withdateranges=0" },
      { title: "ETHUSDT", src: "https://s.tradingview.com/widgetembed/?symbol=BINANCE:ETHUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&save_image=0&withdateranges=0" },
      { title: "SOLUSDT", src: "https://s.tradingview.com/widgetembed/?symbol=BINANCE:SOLUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&save_image=0&withdateranges=0" },
      { title: "DOGEUSDT", src: "https://s.tradingview.com/widgetembed/?symbol=BINANCE:DOGEUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&save_image=0&withdateranges=0" },
      { title: "XRPUSDT", src: "https://s.tradingview.com/widgetembed/?symbol=BINANCE:XRPUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&save_image=0&withdateranges=0" },
      { title: "BNBUSDT", src: "https://s.tradingview.com/widgetembed/?symbol=BINANCE:BNBUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&save_image=0&withdateranges=0" },
      { title: "HYPEUSDT", src: "https://s.tradingview.com/widgetembed/?symbol=OKX:HYPEUSDT&interval=5&theme=dark&hide_top_toolbar=1&hide_legend=1&save_image=0&withdateranges=0" }
    ];
    const MAX_TRADES_PER_CARD = 6;

    const nodes = {
      feedStatus: document.getElementById("feedStatus"),
      tickerCards: document.getElementById("tickerCards"),
      chartGrid: document.getElementById("chartGrid"),
      leftMeta: document.getElementById("leftMeta"),
      mainGrid: document.getElementById("mainGrid"),
      viewButtons: Array.from(document.querySelectorAll(".view-btn"))
    };

    const cardState = new Map();

    function fmtPrice(v) {
      if (typeof v !== "number" || Number.isNaN(v)) return "--";
      return v.toLocaleString(undefined, { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    }

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour12: false });
    }

    function createCards() {
      nodes.tickerCards.innerHTML = "";
      SYMBOLS.forEach((symbol) => {
        const name = symbol.replace("usdt", "").toUpperCase();
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-title">
            <span>${name}/USDT</span>
            <span id="state-${symbol}" class="sub">waiting</span>
          </div>
          <div class="price" id="price-${symbol}">--</div>
          <div class="sig" id="sig-${symbol}">Signal: HOLD</div>
          <div class="bar">
            <div class="bar-buy" id="buy-${symbol}"></div>
            <div class="bar-sell" id="sell-${symbol}"></div>
          </div>
          <div class="mini-trades" id="trades-${symbol}"></div>
        `;
        nodes.tickerCards.appendChild(card);

        cardState.set(symbol, {
          stateEl: card.querySelector(`#state-${symbol}`),
          priceEl: card.querySelector(`#price-${symbol}`),
          sigEl: card.querySelector(`#sig-${symbol}`),
          buyEl: card.querySelector(`#buy-${symbol}`),
          sellEl: card.querySelector(`#sell-${symbol}`),
          tradesEl: card.querySelector(`#trades-${symbol}`),
          buyVol: 0,
          sellVol: 0
        });
      });
      nodes.leftMeta.textContent = `${SYMBOLS.length} symbols`;
    }

    function createCharts() {
      nodes.chartGrid.innerHTML = "";
      CHART_ITEMS.forEach((item) => {
        const wrap = document.createElement("div");
        wrap.className = "chart-tile";
        wrap.innerHTML = `
          <div class="chart-label">${item.title}</div>
          <iframe src="${item.src}" loading="eager" title="${item.title} chart"></iframe>
        `;
        nodes.chartGrid.appendChild(wrap);
      });
    }

    function updateCard(symbol, trade) {
      const c = cardState.get(symbol);
      if (!c) return;

      c.priceEl.textContent = fmtPrice(trade.price);
      if (trade.side === "BUY") c.buyVol += trade.qty;
      else c.sellVol += trade.qty;

      const total = c.buyVol + c.sellVol;
      const buyPct = total ? (c.buyVol / total) * 100 : 50;
      const sellPct = 100 - buyPct;
      c.buyEl.style.width = `${buyPct.toFixed(1)}%`;
      c.sellEl.style.width = `${sellPct.toFixed(1)}%`;

      let signal = "HOLD";
      if (buyPct >= 62) signal = "BUY";
      else if (sellPct >= 62) signal = "SELL";
      c.sigEl.textContent = `Signal: ${signal} (${buyPct.toFixed(0)}% buy)`;
      c.stateEl.textContent = `${trade.side} ${trade.qty.toFixed(3)}`;

      const row = document.createElement("div");
      row.className = "trade-row";
      row.innerHTML = `
        <span>${fmtTime(trade.ts).slice(3)}</span>
        <span class="${trade.side === "BUY" ? "buy" : "sell"}">${trade.side}</span>
        <span>${trade.qty.toFixed(3)} @ ${fmtPrice(trade.price)}</span>
      `;
      c.tradesEl.prepend(row);
      while (c.tradesEl.children.length > MAX_TRADES_PER_CARD) {
        c.tradesEl.removeChild(c.tradesEl.lastChild);
      }
    }

    function connectSymbol(symbol) {
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

      ws.onopen = () => {
        if (symbol === "btcusdt") {
          nodes.feedStatus.textContent = "feed live";
          nodes.feedStatus.className = "badge live";
        }
      };

      ws.onmessage = (event) => {
        const d = JSON.parse(event.data);
        const trade = {
          price: Number(d.p),
          qty: Number(d.q),
          side: d.m ? "SELL" : "BUY",
          ts: Number(d.T) || Date.now()
        };
        updateCard(symbol, trade);
      };

      ws.onclose = () => {
        setTimeout(() => connectSymbol(symbol), 1400);
      };
    }

    function setView(view) {
      nodes.mainGrid.classList.remove("show-ticker", "show-chart");
      if (view === "ticker") nodes.mainGrid.classList.add("show-ticker");
      if (view === "chart") nodes.mainGrid.classList.add("show-chart");

      nodes.viewButtons.forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === view);
      });
    }

    nodes.viewButtons.forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });

    createCards();
    createCharts();
    SYMBOLS.forEach(connectSymbol);
    setView("both");
  </script>
</body>
</html>
